name: Smoke Test

# 云端健康检查：注册临时账号 → 登录 → 轮询同步 → 发消息，验证线上全链路
# 手动触发：Actions → Smoke Test → Run workflow
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke test
        run: |
          set -e
          BASE="https://yu-an2.vercel.app"
          USER="smoketest_$(date +%s)"
          PASS="smoke123456"

          echo "[1] 首页可达性…"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE/")
          echo "    首页 HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "    ❌ 首页不可达"; exit 1; }

          echo "[2] 注册临时账号 $USER …"
          REG=$(curl -s --max-time 30 -X POST "$BASE/api/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USER\",\"password\":\"$PASS\"}")
          echo "    响应: $(echo "$REG" | head -c 200)"
          TOKEN=$(echo "$REG" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$TOKEN" ] || { echo "    ❌ 注册失败（数据库未连通？）"; exit 1; }

          echo "[3] 轮询同步接口…"
          SYNC=$(curl -s --max-time 30 "$BASE/api/sync?after=0&typing=0" \
            -H "Authorization: Bearer $TOKEN")
          echo "    响应: $(echo "$SYNC" | head -c 200)"
          echo "$SYNC" | grep -q '"online"' || { echo "    ❌ 同步接口失败"; exit 1; }

          echo "[4] 发送测试消息…"
          MSG=$(curl -s --max-time 30 -X POST "$BASE/api/messages" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"content":"smoke test ✅"}')
          echo "    响应: $(echo "$MSG" | head -c 200)"
          echo "$MSG" | grep -q '"seq"' || { echo "    ❌ 发送失败"; exit 1; }

          echo ""
          echo "✅ 云端全链路正常：注册 / 登录 / 数据库 / 轮询 / 发消息"
          echo "（临时账号 $USER 留在数据库中，可在方便时清理）"
