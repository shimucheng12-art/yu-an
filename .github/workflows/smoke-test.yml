name: Smoke Test

# 云端健康检查：注册/登录 → 身份校验 → 轮询同步 → 发消息，验证线上全链路
# 触发方式：修改/提交 .smoke 标记文件，或在 Actions 页面手动 Run workflow
on:
  workflow_dispatch:
  push:
    paths:
      - '.smoke'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "等待提交 $GITHUB_SHA 的 Vercel 部署完成…"
          for i in $(seq 1 45); do
            DEP=$(gh api "repos/shimucheng12-art/yu-an/deployments?per_page=10" \
              --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" | head -1 || true)
            if [ -n "$DEP" ]; then
              ST=$(gh api "repos/shimucheng12-art/yu-an/deployments/$DEP/statuses" --jq '.[0].state' || echo pending)
              echo "  第${i}次检查: 部署$DEP = $ST"
              if [ "$ST" = "success" ]; then echo "部署完成"; exit 0; fi
              if [ "$ST" = "failure" ]; then echo "❌ Vercel 部署失败"; exit 1; fi
            else
              echo "  第${i}次检查: 部署尚未创建"
            fi
            sleep 10
          done
          echo "❌ 等待部署超时"; exit 1

      - name: Run smoke test
        run: |
          BASE="https://yu-an2.vercel.app"
          USER="smoketest"
          PASS="smoke123456"

          req() { # method path data
            if [ -n "$3" ]; then
              curl -s --max-time 60 -w "\n__HTTP:%{http_code}__CT:%{content_type}__SIZE:%{size_download}" \
                -X "$1" "$BASE$2" -H "Content-Type: application/json" ${TOKEN:+-H "Authorization: Bearer $TOKEN"} -d "$3"
            else
              curl -s --max-time 60 -w "\n__HTTP:%{http_code}__CT:%{content_type}__SIZE:%{size_download}" \
                -X "$1" "$BASE$2" ${TOKEN:+-H "Authorization: Bearer $TOKEN"}
            fi
          }

          echo "== [1] 首页 =="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE/")
          echo "HTTP $CODE"; [ "$CODE" = "200" ] || { echo "❌ 首页不可达"; exit 1; }

          echo "== [2] 注册（若已存在则改用登录）=="
          OUT=$(req POST /api/auth/register "{\"username\":\"$USER\",\"password\":\"$PASS\"}")
          echo "$OUT" | tail -2; BODY=$(echo "$OUT" | head -n -1)
          TOKEN=$(echo "$BODY" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "-- 注册未拿到 token（可能已存在），尝试登录 --"
            OUT=$(req POST /api/auth/login "{\"username\":\"$USER\",\"password\":\"$PASS\"}")
            echo "$OUT" | tail -2; BODY=$(echo "$OUT" | head -n -1)
            TOKEN=$(echo "$BODY" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          fi
          [ -n "$TOKEN" ] || { echo "❌ 注册/登录均未拿到 token"; exit 1; }
          echo "TOKEN 长度: ${#TOKEN}"

          echo "== [3] 身份校验 /api/auth/me =="
          OUT=$(req GET /api/auth/me); echo "$OUT" | tail -2

          echo "== [4] 轮询同步 /api/sync =="
          OUT=$(req GET "/api/sync?after=0&typing=0"); echo "$OUT" | head -c 400; echo; echo "$OUT" | tail -1

          echo "== [5] 发送消息 =="
          OUT=$(req POST /api/messages '{"content":"smoke test ✅"}')
          echo "$OUT" | tail -2; BODY=$(echo "$OUT" | head -n -1)
          echo "$BODY" | grep -q '"seq"' || { echo "❌ 发送失败"; exit 1; }

          echo ""
          echo "✅ 云端全链路正常"
