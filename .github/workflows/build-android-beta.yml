name: Build YuAn Beta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-beta.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME），直接装组件并接受许可
      # （android-actions/setup-android@v3 的 sdkmanager --update 会因旧 tools 包下架而失败）
      - name: Set up Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager 路径: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 签名密钥不进仓库：以 base64 存在 Actions Secrets（ANDROID_KEYSTORE_B64）
      # 一次生成、永久复用，保证每次构建的 APK 签名一致，可覆盖安装升级
      # 未配置密钥时直接失败，避免产出临时签名 APK（无法覆盖安装，易混淆）
      - name: Restore signing keystore
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > yu-an.keystore
            echo "已恢复签名密钥"
          else
            echo "::error::未设置 ANDROID_KEYSTORE_B64（本地构建请运行 android/build.sh）"
            exit 1
          fi
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build Beta APK
        run: |
          chmod +x android/build.sh
          SDK_ROOT="$ANDROID_HOME" ./android/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yu-an-v4.0-beta
          path: yu-an-v4.0-beta.apk
          if-no-files-found: error
