name: Build YuAn Beta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-beta.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME），直接装组件并接受许可
      # （android-actions/setup-android@v3 的 sdkmanager --update 会因旧 tools 包下架而失败）
      - name: Set up Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Beta APK
        run: |
          chmod +x android/build.sh
          SDK_ROOT="$ANDROID_HOME" ./android/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yu-an-v4.0-beta
          path: yu-an-v4.0-beta.apk
          if-no-files-found: error
