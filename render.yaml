# 余安 v4.0-beta · Render 蓝图（免绑卡方案）
# 架构：
#   yuan-beta（Next.js 主站，含 API）
#   yuan-chat（Socket.io 实时服务，消息推送 / 在线状态）
# 数据库：Neon 免费版（已预建表）。两个服务均为免费 web 服务，
# Render 对纯 web 服务不要求绑卡；DATABASE_URL 部署时粘贴 Neon 连接串。
# 区域 ohio 与 Neon 数据库（us-east-2）同区，数据库往返延迟最低。
# 共享密钥通过 envVarGroup 下发，保证 JWT / 内部广播签名一致。

envVarGroups:
  - name: yuan-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: INTERNAL_SECRET
        generateValue: true
        sync: false

services:
  # —— 余安主站（Next.js）——
  - type: web
    name: yuan-beta
    runtime: node
    plan: free
    region: ohio
    # 构建时同步数据库结构（表已预建，通常为无操作）；
    # 顺带清理 channel_binding 参数，避免个别工具不识别
    buildCommand: >-
      npm install --include=dev &&
      export DATABASE_URL=$(echo "$DATABASE_URL" | sed 's/&channel_binding=require//g') &&
      npx prisma db push --accept-data-loss &&
      npm run build
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api
    envVars:
      - fromEnvVarGroup: yuan-secrets
      # Neon 数据库连接串（postgresql://…?sslmode=require），部署时粘贴
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # 浏览器端 Socket 连接地址（构建时注入）
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://yuan-chat.onrender.com
      # 服务端内部广播目标（socket-admin 使用）
      - key: CHAT_SERVICE_URL
        value: https://yuan-chat.onrender.com

  # —— 余安实时服务（Socket.io）——
  - type: web
    name: yuan-chat
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev
    startCommand: npx tsx mini-services/chat-service/index.ts
    envVars:
      - fromEnvVarGroup: yuan-secrets
      - key: NODE_ENV
        value: production
