services:
  - type: web
    name: yuan-beta
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma db push
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yuan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: yuan-db
    plan: free
    databaseName: yuan
    user: yuan
