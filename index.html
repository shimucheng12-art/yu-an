<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轻聊 · 聊天室（演示版）</title>
<meta name="description" content="轻聊 QingLiao——文字聊天 · 文件分享。纯前端演示版：同一浏览器多开标签页即可实时互聊。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7.9 20A9 9 0 1 0 4 16.1L2 22Z'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f8f7; --card:#ffffff; --text:#1a2420; --muted:#6b7a74; --border:#e2e8e5;
    --primary:#059669; --primary-strong:#047857; --primary-soft:rgba(16,185,129,.12);
    --bubble-other:#eef2f0; --shadow:0 8px 28px rgba(6,45,32,.08);
    --input-bg:#f0f3f2;
  }
  html[data-theme="dark"]{
    --bg:#0d1210; --card:#151c19; --text:#e6ece9; --muted:#8fa39b; --border:#243029;
    --primary:#10b981; --primary-strong:#34d399; --primary-soft:rgba(16,185,129,.16);
    --bubble-other:#1c2621; --shadow:0 8px 28px rgba(0,0,0,.4);
    --input-bg:#1a231f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);transition:background .25s,color .25s;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---------- 登录页 ---------- */
  #loginView{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:
      radial-gradient(1000px 500px at 85% -10%, var(--primary-soft), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, var(--primary-soft), transparent 55%),
      var(--bg);}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:32px 28px;box-shadow:var(--shadow);
    animation:rise .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
  .brand-logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#14b8a6);
    display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 24px rgba(5,150,105,.3)}
  .brand h1{font-size:24px;letter-spacing:.5px}
  .brand p{font-size:13px;color:var(--muted)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--input-bg);outline:none;transition:border .15s, box-shadow .15s}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;
    border-radius:12px;font-weight:600;transition:transform .12s, background .15s, opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-strong)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .login-tip{margin-top:18px;font-size:12px;line-height:1.7;color:var(--muted);text-align:center}
  .login-error{font-size:12px;color:#e11d48;margin-top:6px;min-height:16px}

  /* ---------- 聊天页 ---------- */
  #chatView{height:100dvh;display:flex;flex-direction:column}
  header{height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--card);border-bottom:1px solid var(--border)}
  .h-logo{width:32px;height:32px;border-radius:10px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  header h1{font-size:16px;margin-right:6px}
  .conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--primary);
    background:var(--primary-soft);padding:3px 10px;border-radius:99px}
  .conn .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .h-right{margin-left:auto;display:flex;align-items:center;gap:4px}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:var(--muted);transition:background .15s,color .15s}
  .icon-btn:hover{background:var(--primary-soft);color:var(--primary)}
  .me-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--input-bg)}
  .me-chip .name{font-size:13px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .online-count{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;
    background:var(--input-bg);color:var(--muted)}

  /* 演示横幅 */
  .banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;font-size:12px;line-height:1.6;
    background:var(--primary-soft);color:var(--text);border-bottom:1px solid var(--border)}
  .banner svg{flex-shrink:0;margin-top:1px;color:var(--primary)}
  .banner .x{margin-left:auto;flex-shrink:0;color:var(--muted);padding:2px}
  .banner .x:hover{color:var(--text)}

  .body{flex:1;min-height:0;display:flex}
  aside{width:230px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);
    display:flex;flex-direction:column}
  .aside-title{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;font-size:13px;font-weight:600;color:var(--muted)}
  .aside-title .n{margin-left:auto;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:1px 8px;font-size:11px}
  .aside-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .peer{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
  .peer:hover{background:var(--input-bg)}
  .peer .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .peer .me-tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .aside-foot{border-top:1px solid var(--border);padding:12px 16px;font-size:11px;line-height:1.7;color:var(--muted)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  #msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
  .day{display:flex;justify-content:center;margin:14px 0}
  .day span{font-size:11px;color:var(--muted);background:var(--bubble-other);padding:4px 12px;border-radius:99px}
  .row{display:flex;gap:8px;align-items:flex-end;margin-top:14px;animation:rise .22s ease-out}
  .row.compact{margin-top:3px}
  .row.own{flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;user-select:none}
  .row .ph{width:34px;flex-shrink:0}
  .col{display:flex;flex-direction:column;gap:3px;max-width:76%;min-width:0}
  .row.own .col{align-items:flex-end}
  .who{font-size:12px;font-weight:600;padding:0 4px}
  .bubble{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap;
    box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .row:not(.own) .bubble{background:var(--bubble-other);border-bottom-left-radius:5px}
  .row.own .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:5px}
  .time{font-size:10.5px;color:var(--muted);padding:0 4px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
  .empty svg{opacity:.35}
  .empty b{color:var(--text)}

  /* 文件气泡 */
  .file-card{display:flex;align-items:center;gap:10px;min-width:220px;max-width:270px;padding:2px 0}
  .file-ico{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--primary-soft);color:var(--primary)}
  .row.own .file-ico{background:rgba(255,255,255,.22);color:#fff}
  .file-meta{flex:1;min-width:0}
  .file-meta .fn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-meta .fs{font-size:11px;opacity:.75}
  .dl-btn{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:inherit;opacity:.8;transition:background .15s}
  .dl-btn:hover{background:rgba(0,0,0,.08);opacity:1}
  .row.own .dl-btn:hover{background:rgba(255,255,255,.2)}
  .img-wrap{display:block;border-radius:12px;overflow:hidden;cursor:zoom-in;line-height:0;transition:transform .18s}
  .img-wrap:hover{transform:scale(1.015)}
  .img-wrap img{max-width:100%;max-height:240px;border-radius:12px;display:block}

  /* 输入区 */
  .typing-row{height:26px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:12px;color:var(--muted)}
  .tdots{display:inline-flex;gap:3px}
  .tdots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:bnc 1.1s infinite}
  .tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
  @keyframes bnc{30%{transform:translateY(-3px)}}
  footer{flex-shrink:0;border-top:1px solid var(--border);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
  .foot-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
  #input{flex:1;resize:none;border:1px solid var(--border);background:var(--input-bg);border-radius:16px;
    padding:10px 14px;max-height:132px;min-height:42px;line-height:1.5;font-size:14px;outline:none;
    transition:border .15s, box-shadow .15s}
  #input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .round-btn{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .round-btn.attach{border:1px solid var(--border);color:var(--muted)}
  .round-btn.attach:hover{color:var(--primary);border-color:var(--primary)}
  .round-btn.send{background:var(--primary);color:#fff}
  .round-btn.send:hover{background:var(--primary-strong)}
  .round-btn.send[disabled]{opacity:.45;cursor:not-allowed}

  /* 滚动按钮 */
  #scrollBtn{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:600;
    padding:8px 14px;border-radius:99px;box-shadow:0 6px 18px rgba(5,150,105,.35);
    animation:rise .2s ease-out;z-index:5}

  /* 弹层 */
  .modal{position:fixed;inset:0;background:rgba(8,12,10,.72);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:60;animation:fade .18s}
  @keyframes fade{from{opacity:0}}
  .modal-card{max-width:860px;width:100%;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
  .modal img{display:block;max-width:100%;max-height:68vh;margin:0 auto;object-fit:contain}
  .modal-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border);font-size:13px}
  .modal-bar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

  /* 提示 */
  #toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;
    padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);animation:rise .25s ease-out;max-width:86vw}
  .toast.ok{border-color:var(--primary);color:var(--primary)}

  /* 移动端在线列表弹层 */
  #peersSheet{position:fixed;inset:0;background:rgba(8,12,10,.4);z-index:50;display:flex;align-items:flex-start;justify-content:flex-end;padding:64px 14px 0}
  .sheet{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
    width:240px;padding:10px;animation:rise .2s ease-out}

  @media (max-width:820px){
    aside{display:none}
    .col{max-width:84%}
    .me-chip .name{display:none}
  }
  @media (min-width:821px){
    #peersBtn{display:none}
  }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(128,140,135,.35);border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      </div>
      <div style="text-align:center">
        <h1>轻聊</h1>
        <p>文字聊天 · 文件分享</p>
      </div>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="nameInput">你的昵称</label>
        <input id="nameInput" maxlength="20" placeholder="2-20 个字符，中英文均可" autocomplete="off" autofocus>
        <div class="login-error" id="loginErr"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">进入聊天</button>
    </form>
    <p class="login-tip">
      演示版数据仅保存在<b>当前浏览器</b><br>
      多开几个标签页、用不同昵称进入，即可实时互聊
    </p>
  </div>
</div>

<!-- ================= 聊天 ================= -->
<div id="chatView" class="hidden">
  <header>
    <div class="h-logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    </div>
    <h1>轻聊</h1>
    <span class="conn" id="connBadge"><span class="dot"></span>本地实时</span>

    <div class="h-right">
      <button class="online-count" id="peersBtn" aria-label="查看在线成员">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span id="peersCount">1</span>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="切换深浅主题" title="切换深浅主题"></button>
      <button class="icon-btn" id="clearBtn" aria-label="清空聊天记录" title="清空聊天记录">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
      <span class="me-chip"><span id="meAvatar"></span><span class="name" id="meName"></span></span>
      <button class="icon-btn" id="logoutBtn" aria-label="退出登录" title="退出登录">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="demoBanner">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span><b>演示版说明</b>：聊天记录与文件仅保存在当前浏览器（localStorage）。完整版（账号登录、云端同步、跨设备）源码见 GitHub 仓库。</span>
    <button class="x" id="bannerClose" aria-label="关闭说明">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div class="body">
    <aside aria-label="在线成员">
      <div class="aside-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        在线成员 <span class="n" id="asideCount">1</span>
      </div>
      <div class="aside-list" id="peersList"></div>
      <div class="aside-foot">同一浏览器内打开的每个标签页<br>都会作为一个独立成员加入</div>
    </aside>

    <main class="main">
      <div id="msgs" role="log" aria-label="聊天消息" aria-live="polite"></div>
      <button id="scrollBtn" class="hidden"></button>
      <div class="typing-row" id="typingRow" aria-live="polite"></div>
      <footer>
        <div class="foot-bar">
          <input type="file" id="fileInput" class="hidden" tabindex="-1" aria-hidden="true">
          <button class="round-btn attach" id="attachBtn" aria-label="发送文件" title="发送文件（不超过 2MB）">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" maxlength="4000" aria-label="消息输入框"></textarea>
          <button class="round-btn send" id="sendBtn" aria-label="发送消息" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
      </footer>
    </main>
  </div>
</div>

<div id="peersSheet" class="hidden">
  <div class="sheet">
    <div class="aside-title" style="padding:6px 8px 6px">
      在线成员 <span class="n" id="sheetCount">1</span>
    </div>
    <div id="sheetList"></div>
  </div>
</div>

<div id="imgModal" class="modal hidden">
  <div class="modal-card">
    <img id="modalImg" alt="图片预览">
    <div class="modal-bar">
      <span class="nm" id="modalName"></span>
      <button class="btn btn-primary" id="modalDownload" style="height:36px;font-size:13px">下载原图</button>
      <button class="icon-btn" id="modalClose" aria-label="关闭预览">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  /* ================= 常量与工具 ================= */
  var K_MSGS = 'ql_messages', K_ME = 'ql_me', K_LAST = 'ql_last_user', K_THEME = 'ql_theme', K_BANNER = 'ql_banner_off';
  var MAX_KEEP = 150;
  var MAX_FILE = 2 * 1024 * 1024;
  var COLORS = ['#10b981', '#14b8a6', '#84cc16', '#eab308', '#f97316', '#f43f5e', '#ec4899', '#a855f7'];

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }
  function colorFor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function fmtSize(b) {
    if (b == null) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }
  function dayLabel(ts) {
    var d = new Date(ts), now = new Date();
    var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var t1 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((t0 - t1) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    return (d.getFullYear()) + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function toast(msg, isOk) {
    var t = el('div', 'toast' + (isOk ? ' ok' : ''), msg);
    $('toasts').appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2400);
    setTimeout(function () { t.remove(); }, 2800);
  }
  function iconBtnSvg(path, size) {
    var s = size || 17;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
  }

  /* ================= 存储 ================= */
  function loadMsgs() {
    try {
      var raw = localStorage.getItem(K_MSGS);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveMsgs() {
    var keep = msgs.slice(-MAX_KEEP);
    while (keep.length > 0) {
      try {
        localStorage.setItem(K_MSGS, JSON.stringify(keep));
        if (keep.length < msgs.length) toast('本地存储空间不足，已自动清理最早的消息');
        msgs = keep;
        return true;
      } catch (e) {
        keep = keep.slice(10); // 超额则每次多丢弃 10 条
      }
    }
    toast('本地存储空间不足，消息未能保存');
    return false;
  }

  /* ================= 主题 ================= */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(K_THEME, t);
    $('themeBtn').innerHTML = t === 'dark'
      ? iconBtnSvg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>')
      : iconBtnSvg('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>');
  }
  var savedTheme = localStorage.getItem(K_THEME);
  applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('themeBtn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ================= 消息渲染 ================= */
  var msgsBox = $('msgs');

  function avatarNode(user, size) {
    var a = el('div', 'avatar', (user.name.trim()[0] || '?').toUpperCase());
    a.style.background = user.color;
    a.style.fontSize = (size || 14) + 'px';
    return a;
  }

  function fileIcon(m) {
    var t = m.fileType || '';
    if (t.indexOf('zip') >= 0 || t.indexOf('compress') >= 0 || t.indexOf('tar') >= 0) return '<path d="M21 8v13H3V8"/><path d="M1 3h15v5H1z"/><path d="M10 12h4"/>';
    if (t.indexOf('audio') === 0) return '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>';
    if (t.indexOf('video') === 0) return '<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>';
    if (t.indexOf('sheet') >= 0 || t.indexOf('excel') >= 0 || t.indexOf('csv') >= 0) return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/>';
    if (t.indexOf('text') === 0 || t.indexOf('pdf') >= 0 || t.indexOf('word') >= 0 || t.indexOf('json') >= 0) return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/>';
    return '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>';
  }

  function buildBubble(m, own) {
    var b = el('div', 'bubble');
    if (m.type === 'file' && m.isImage && m.fileData) {
      var wrap = el('button', 'img-wrap');
      wrap.type = 'button';
      wrap.setAttribute('aria-label', '查看图片 ' + (m.fileName || ''));
      var img = el('img');
      img.src = m.fileData;
      img.alt = m.fileName || '图片';
      wrap.appendChild(img);
      wrap.addEventListener('click', function () { openImage(m); });
      b.appendChild(wrap);
      b.style.padding = '4px';
      b.style.whiteSpace = 'normal';
    } else if (m.type === 'file') {
      var card = el('div', 'file-card');
      var ico = el('div', 'file-ico');
      ico.innerHTML = iconBtnSvg(fileIcon(m), 19);
      ico.setAttribute('aria-hidden', 'true');
      var meta = el('div', 'file-meta');
      meta.appendChild(el('div', 'fn', m.fileName || '文件'));
      meta.appendChild(el('div', 'fs', fmtSize(m.fileSize)));
      var dl = el('button', 'dl-btn');
      dl.type = 'button';
      dl.setAttribute('aria-label', '下载文件 ' + (m.fileName || ''));
      dl.innerHTML = iconBtnSvg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>', 15);
      dl.addEventListener('click', function () { downloadData(m.fileData, m.fileName); });
      card.appendChild(ico); card.appendChild(meta); card.appendChild(dl);
      b.appendChild(card);
      b.style.whiteSpace = 'normal';
    } else {
      b.textContent = m.content || '';
    }
    return b;
  }

  function appendMessage(m, animate) {
    if (!animate && document.getElementById('m-' + m.id)) return;
    var own = m.user.id === (me && me.tabId);
    var prev = lastRender;
    var dk = dayKey(m.ts);
    var showDay = !prev || prev.dk !== dk;
    var compact = !showDay && prev && prev.uid === m.user.id && (m.ts - prev.ts) < 5 * 60000;

    if (showDay) {
      var day = el('div', 'day');
      day.appendChild(el('span', null, dayLabel(m.ts)));
      msgsBox.appendChild(day);
    }

    var row = el('div', 'row' + (own ? ' own' : '') + (compact ? ' compact' : ''));
    row.id = 'm-' + m.id;
    if (compact) {
      row.appendChild(el('div', 'ph'));
    } else {
      row.appendChild(avatarNode(m.user));
    }
    var col = el('div', 'col');
    if (!compact && !own) {
      var who = el('span', 'who', m.user.name);
      who.style.color = m.user.color;
      col.appendChild(who);
    }
    col.appendChild(buildBubble(m, own));
    col.appendChild(el('span', 'time', fmtTime(m.ts)));
    row.appendChild(col);
    msgsBox.appendChild(row);

    lastRender = { uid: m.user.id, ts: m.ts, dk: dk };
  }

  function renderAll() {
    msgsBox.innerHTML = '';
    lastRender = null;
    if (msgs.length === 0) {
      var empty = el('div', 'empty');
      empty.innerHTML = iconBtnSvg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 44);
      var p = el('div');
      p.appendChild(el('b', null, '还没有消息'));
      var hint = el('div', null, '再打开一个标签页、用另一个昵称进入\n就能开始对话，也可以直接发送文字和文件');
      hint.style.whiteSpace = 'pre-line';
      p.appendChild(hint);
      empty.appendChild(p);
      msgsBox.appendChild(empty);
      return;
    }
    for (var i = 0; i < msgs.length; i++) appendMessage(msgs[i], false);
  }

  function isNearBottom() {
    return msgsBox.scrollHeight - msgsBox.scrollTop - msgsBox.clientHeight < 130;
  }
  function scrollToBottom(instant) {
    msgsBox.scrollTop = msgsBox.scrollHeight;
    if (instant) msgsBox.style.scrollBehavior = '';
  }
  function updateScrollState() {
    nearBottom = isNearBottom();
    var btn = $('scrollBtn');
    if (nearBottom) {
      unread = 0;
      btn.classList.add('hidden');
    }
  }
  msgsBox.addEventListener('scroll', updateScrollState);
  $('scrollBtn').addEventListener('click', function () {
    unread = 0;
    scrollToBottom(false);
    $('scrollBtn').classList.add('hidden');
  });

  function onNewMessage(m) {
    msgs.push(m);
    appendMessage(m, true);
    if (nearBottom) {
      scrollToBottom(false);
    } else {
      unread++;
      var btn = $('scrollBtn');
      btn.classList.remove('hidden');
      btn.innerHTML = iconBtnSvg('<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>', 13) + (unread > 0 ? unread + ' 条新消息' : '回到底部');
    }
  }

  /* ================= 图片预览 ================= */
  function openImage(m) {
    $('modalImg').src = m.fileData;
    $('modalName').textContent = m.fileName || '图片';
    $('modalDownload').onclick = function () { downloadData(m.fileData, m.fileName); };
    $('imgModal').classList.remove('hidden');
  }
  $('modalClose').addEventListener('click', function () { $('imgModal').classList.add('hidden'); });
  $('imgModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.add('hidden');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('imgModal').classList.add('hidden');
  });

  function downloadData(href, name) {
    var a = document.createElement('a');
    a.href = href;
    a.download = name || 'file';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* ================= 广播通道（多标签页实时） ================= */
  function post(t, extra) {
    if (!ch) return;
    var p = { t: t, from: { id: me.tabId, name: me.name, color: me.color } };
    if (extra) for (var k in extra) p[k] = extra[k];
    try { ch.postMessage(p); } catch (e) { /* 忽略 */ }
  }
  function handleBus(e) {
    var d = e.data;
    if (!d || !d.from || d.from.id === me.tabId) return;
    if (d.t === 'hello') {
      peers[d.from.id] = { name: d.from.name, color: d.from.color, seen: Date.now() };
      post('here');
      toast(d.from.name + ' 上线了', true);
    } else if (d.t === 'here' || d.t === 'ping') {
      peers[d.from.id] = { name: d.from.name, color: d.from.color, seen: Date.now() };
    } else if (d.t === 'bye') {
      delete peers[d.from.id];
      delete typing[d.from.id];
      toast(d.from.name + ' 离开了');
    } else if (d.t === 'msg') {
      if (d.m && d.m.id && !msgs.some(function (x) { return x.id === d.m.id; })) {
        onNewMessage(d.m);
      }
    } else if (d.t === 'typing') {
      if (d.isTyping) typing[d.from.id] = { name: d.from.name, seen: Date.now() };
      else delete typing[d.from.id];
    }
    renderPeers();
    renderTyping();
  }
  function renderPeers() {
    var list = [{ id: me.tabId, name: me.name, color: me.color }];
    for (var id in peers) list.push({ id: id, name: peers[id].name, color: peers[id].color });
    list.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });

    function makeList() {
      var frag = document.createDocumentFragment();
      list.forEach(function (u) {
        var item = el('div', 'peer');
        var holder = el('div');
        holder.style.position = 'relative';
        holder.appendChild(avatarNode(u));
        var dot = el('span');
        dot.style.cssText = 'position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#10b981;border:2px solid var(--card)';
        holder.appendChild(dot);
        item.appendChild(holder);
        item.appendChild(el('span', 'nm', u.name));
        if (u.id === me.tabId) item.appendChild(el('span', 'me-tag', '我'));
        frag.appendChild(item);
      });
      return frag;
    }
    var pl = $('peersList'); pl.innerHTML = ''; pl.appendChild(makeList());
    var sl = $('sheetList'); sl.innerHTML = ''; sl.appendChild(makeList());
    $('peersCount').textContent = list.length;
    $('asideCount').textContent = list.length;
    $('sheetCount').textContent = list.length;
  }
  function renderTyping() {
    var names = [];
    var now = Date.now();
    for (var id in typing) {
      if (now - typing[id].seen > 3000) delete typing[id];
      else names.push(typing[id].name);
    }
    var row = $('typingRow');
    if (names.length === 0) { row.innerHTML = ''; return; }
    var dots = el('span', 'tdots');
    dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
    row.innerHTML = '';
    row.appendChild(dots);
    row.appendChild(document.createTextNode(names.join('、') + ' 正在输入…'));
  }

  var heartbeat = null, sweeper = null;
  function startLife() {
    ch = new BroadcastChannel('qingliao-demo');
    ch.onmessage = handleBus;
    post('hello');
    heartbeat = setInterval(function () { post('ping'); }, 4000);
    sweeper = setInterval(function () {
      var now = Date.now(), changed = false;
      for (var id in peers) if (now - peers[id].seen > 13000) { delete peers[id]; changed = true; }
      renderPeers();
      renderTyping();
    }, 3000);
    window.addEventListener('beforeunload', function () { post('bye'); });
  }
  function stopLife() {
    if (heartbeat) clearInterval(heartbeat);
    if (sweeper) clearInterval(sweeper);
    heartbeat = sweeper = null;
    if (ch) { try { post('bye'); ch.close(); } catch (e) {} ch = null; }
    peers = {};
    typing = {};
  }

  /* ================= 输入与发送 ================= */
  var input = $('input');
  function refreshSendBtn() {
    $('sendBtn').disabled = !input.value.trim();
  }
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 132) + 'px';
    refreshSendBtn();
    var now = Date.now();
    if (input.value.trim()) {
      if (now - typingSentAt > 900) { typingSentAt = now; post('typing', { isTyping: true }); }
    } else {
      post('typing', { isTyping: false });
    }
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendText();
    }
  });
  $('sendBtn').addEventListener('click', sendText);

  function sendText() {
    var content = input.value.trim();
    if (!content || !me) return;
    var m = { id: uid(), ts: Date.now(), user: { id: me.tabId, name: me.name, color: me.color }, type: 'text', content: content };
    commit(m);
    input.value = '';
    input.style.height = 'auto';
    refreshSendBtn();
    post('typing', { isTyping: false });
  }

  function commit(m) {
    msgs.push(m);
    if (msgs.length > MAX_KEEP) msgs = msgs.slice(-MAX_KEEP);
    saveMsgs();
    appendMessage(m, true);
    nearBottom = true;
    scrollToBottom(false);
    post('msg', { m: m });
  }

  /* ================= 文件发送 ================= */
  $('attachBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f || !me) return;
    if (f.size > MAX_FILE) { toast('演示版单个文件不能超过 2MB（完整版为 20MB）'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var m = {
        id: uid(), ts: Date.now(),
        user: { id: me.tabId, name: me.name, color: me.color },
        type: 'file', fileName: f.name, fileType: f.type || 'application/octet-stream',
        fileSize: f.size, isImage: (f.type || '').indexOf('image/') === 0, fileData: fr.result
      };
      commit(m);
      toast('文件已发送', true);
    };
    fr.onerror = function () { toast('文件读取失败，请重试'); };
    fr.readAsDataURL(f);
  });

  /* ================= 顶栏操作 ================= */
  $('logoutBtn').addEventListener('click', function () {
    stopLife();
    sessionStorage.removeItem(K_ME);
    me = null;
    $('chatView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('nameInput').focus();
  });
  $('clearBtn').addEventListener('click', function () {
    if (!confirm('确定清空本地聊天记录？此操作不可恢复。')) return;
    msgs = [];
    try { localStorage.removeItem(K_MSGS); } catch (e) {}
    renderAll();
    toast('聊天记录已清空', true);
  });
  if (localStorage.getItem(K_BANNER) === '1') $('demoBanner').classList.add('hidden');
  $('bannerClose').addEventListener('click', function () {
    $('demoBanner').classList.add('hidden');
    localStorage.setItem(K_BANNER, '1');
  });
  $('peersBtn').addEventListener('click', function () { $('peersSheet').classList.remove('hidden'); });
  $('peersSheet').addEventListener('click', function (e) {
    if (e.target === this) this.classList.add('hidden');
  });

  /* ================= 登录 ================= */
  function enterChat(user) {
    me = { tabId: uid(), name: user.name, color: colorFor(user.name) };
    sessionStorage.setItem(K_ME, JSON.stringify({ name: user.name }));
    localStorage.setItem(K_LAST, user.name);

    seedIfEmpty();
    msgs = loadMsgs();
    renderAll();
    scrollToBottom(true);

    $('meAvatar').innerHTML = '';
    $('meAvatar').appendChild(avatarNode(me, 26));
    $('meName').textContent = me.name;

    $('loginView').classList.add('hidden');
    $('chatView').classList.remove('hidden');

    startLife();
    renderPeers();
    input.focus();
    scrollToBottom(true);
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('nameInput').value.trim();
    var err = '';
    if (name.length < 2 || name.length > 20) err = '昵称需为 2-20 个字符';
    else if (!/^[\u4e00-\u9fa5A-Za-z0-9_-]+$/.test(name)) err = '仅支持中文、字母、数字、下划线和连字符';
    $('loginErr').textContent = err;
    if (err) return;
    enterChat({ name: name });
  });
  $('nameInput').value = localStorage.getItem(K_LAST) || '';

  /* 刷新后恢复本标签页身份 */
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(K_ME) || 'null'); } catch (e) {}
  if (saved && saved.name) {
    $('nameInput').value = saved.name;
    enterChat({ name: saved.name });
  }
})();
</script>
</body>
</html>
